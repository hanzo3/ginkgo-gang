function build(def){
 const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(def.w).fill(y>=13?'#':' '));
 const L={w:def.w,g,items:{},en:[],checks:[],goal:def.w-9,theme:def.theme,name:def.name};
 const b={
  set(x,y,c){if(x>=0&&x<L.w&&y>=0&&y<ROWS)g[y][x]=c},
  gap(x,w){for(let i=0;i<w;i++){b.set(x+i,13,' ');b.set(x+i,14,' ')}},
  plat(x,y,w,c='B'){for(let i=0;i<w;i++)b.set(x+i,y,c)},
  q(x,y,it='c'){b.set(x,y,'?');L.items[x+','+y]=it},
  coins(x,y,n){for(let i=0;i<n;i++)b.set(x+i,y,'o')},
  col(x,h,c='S'){for(let i=0;i<h;i++)b.set(x,12-i,c)},
  hedge(x,h){b.col(x,h,'H');b.col(x+1,h,'H')},
  stairs(x,h,d){for(let i=0;i<h;i++)b.col(x+i,d>0?i+1:h-i)},
  en(t,x,row=13){L.en.push({t,x,row})},
  check(x){L.checks.push(x)},
  ceil(){for(let x=0;x<L.w;x++){b.set(x,0,'S');b.set(x,1,'S')}},
  wall(x,h){b.col(x,h);b.col(x+1,h)},
  lava(x){L.en.push({t:'l',x,row:13})},
  boss(kind,x,ax0,ax1){L.boss={kind,x,ax0,ax1}},
  gate(x){L.gate=x;for(let y=2;y<13;y++)b.set(x,y,'G')}
 };
 def.build(b);return L;
}

/* ---------- audio ---------- */
let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',v=.07,slide=0,delay=0){
 if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
 jump(){tone(300,.16,'square',.05,320)},coin(){tone(988,.07,'square',.05);tone(1319,.22,'square',.05,0,.07)},

 power(){[523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.06,0,i*.07))},

let prevJ=false,prevA=false,wantSwap=-2;
addEventListener('keydown',e=>{
 initAudio();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;if(e.metaKey||e.ctrlKey||e.altKey){clearInput();return}keys[e.code]=true;
 if(G.state==='title'){
  if(e.code==='ArrowLeft'||e.code==='KeyA')G.sel=(G.sel+CH.length-1)%CH.length;
  if(e.code==='ArrowRight'||e.code==='KeyD')G.sel=(G.sel+1)%CH.length;
  if(e.code==='Enter'||e.code==='Space')startGame();
 }else if(G.state==='gameover'||G.state==='win'){if(e.code==='Enter'||e.code==='Space')advance()}
 else{
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(e.code==='KeyC'||e.code==='KeyQ')wantSwap=-1;
  if(/^Digit[1-5]$/.test(e.code))wantSwap=+e.code[5]-1;
 }
 if(e.code==='KeyM')toggleMute();
});

function clearInput(){for(const k in keys)keys[k]=false;touch.l=touch.r=touch.jump=touch.act=false;for(const el of document.querySelectorAll('.dn'))el.classList.remove('dn')}

addEventListener('touchend',e=>{if(!e.touches.length)clearInput()},{passive:true});addEventListener('touchcancel',clearInput,{passive:true});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')clearTouch()});
function clearTouch(){touch.l=touch.r=touch.jump=touch.act=false;for(const el of document.querySelectorAll('.dn'))el.classList.remove('dn')}
function hold(el,name){
 const dn=e=>{e.preventDefault();initAudio();touch[name]=true;el.classList.add('dn')},up=()=>{touch[name]=false;el.classList.remove('dn')};
 el.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up));
}

const dp=$('dpad');
function dpSet(e){const r=dp.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;touch.l=left;touch.r=!left}
dp.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{dp.setPointerCapture(e.pointerId)}catch(_){}dp.classList.add('dn');dpSet(e)});
dp.addEventListener('pointermove',e=>{if(dp.classList.contains('dn'))dpSet(e)});
['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(n=>dp.addEventListener(n,()=>{touch.l=touch.r=false;dp.classList.remove('dn')}));

cv.addEventListener('pointerdown',e=>{
 initAudio();const r=cv.getBoundingClientRect(),tw=Math.round(VH*ASP),x=(e.clientX-r.left)/r.width*tw,y=(e.clientY-r.top)/r.height*VH;
 if(G.state==='title'){
  const g=titleGeo(tw),inR=q=>x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h;
  if(g.col){
   for(let i=0;i<CH.length;i++){if(inR({x:8+i*(g.tw+g.gap),y:g.ty,w:g.tw,h:g.th})){if(G.sel!==i){G.sel=i;sfx.swap()}return}}
   const c=g.card;if(inR(c)){if(x<c.x+60){G.sel=(G.sel+CH.length-1)%CH.length;sfx.swap()}else if(x>c.x+c.w-60){G.sel=(G.sel+1)%CH.length;sfx.swap()}return}
   if(inR(g.play))startGame();
  }else{
   const c=g.c;
   for(let i=0;i<CH.length;i++){const cx=c.x0+i*(c.cw+c.gap);if(x>=cx&&x<=cx+c.cw&&y>=c.y0&&y<=c.y0+c.ch){if(G.sel===i)startGame();else{G.sel=i;sfx.swap()}return}}
   if(inR(g.play))startGame();
  }
 }else if(G.state==='gameover'||G.state==='win')advance();
 else if(G.state==='pause')togglePause();
});
function toggleMute(){muted=!muted;$('bMute').style.opacity=muted?.4:1}
function togglePause(){clearInput();if(G.state==='play')G.state='pause';else if(G.state==='pause')G.state='play'}

/* ---------- game flow ---------- */
function startGame(){G.ci=G.sel;G.score=0;G.coins=0;G.lives=3;G.level=0;loadLevel(0,3);G.state='play';sfx.power()}
function advance(){if(G.state==='gameover'){G.score=0;G.coins=0;G.lives=3;loadLevel(G.level,3);G.state='play'}else G.state='title'}

function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0||tx>=L.w)return true;return !!SOLID[L.g[ty][tx]]}
function moveEnt(e,dt){
 const res={hitX:false,head:null};
 e.x+=e.vx*dt;
 let y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
 if(e.vx>0){const tx=Math.floor((e.x+e.w-.01)/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w;res.hitX=true;break}}
 else if(e.vx<0){const tx=Math.floor(e.x/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T;res.hitX=true;break}}
 e.y+=e.vy*dt;e.on=false;
 const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T);
 if(e.vy>=0){const ty=Math.floor((e.y+e.h-.01)/T);for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){e.y=ty*T-e.h;e.vy=0;e.on=true;break}}
 else{const ty=Math.floor(e.y/T),cx=Math.floor((e.x+e.w/2)/T);let hit=null;
  for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){if(!hit||tx===cx)hit=[tx,ty]}
  if(hit){e.y=(ty+1)*T;e.vy=0;res.head=hit}}
 return res;
}

function knockAbove(tx,ty){for(const e of ents)if(!e.dying&&e.active&&Math.abs(e.y+e.h-ty*T)<4&&e.x+e.w>tx*T&&e.x<tx*T+T)killEnt(e)}

 if(wantSwap>-2){trySwap(wantSwap);wantSwap=-2}
 for(const k of['inv','star','actT','actCd','dashT','coy','jbuf','swapCd','growT'])if(p[k]>0)p[k]=Math.max(0,p[k]-dt);
 /* horizontal */
 const ax=p.pound?0:(inp.r?1:0)-(inp.l?1:0),maxv=c.speed;

 else{const tg=ax*maxv,acc=(p.on?(ax?1700:2200):1100)*dt;if(p.vx<tg)p.vx=Math.min(tg,p.vx+acc);else if(p.vx>tg)p.vx=Math.max(tg,p.vx-acc);if(ax)p.face=ax}

 if(!inp.jump&&p.cut&&p.vy<-240){p.vy=-240;p.cut=false}
 p.floating=false;
 if(c.id==='zibbi'&&inp.jump&&!p.on&&p.vy>=0&&p.floatT>0&&!p.pound){p.floating=true;p.floatT-=dt;p.vy+=(25-p.vy)*Math.min(1,dt*14);
  if(Math.random()<.5)parts.push({x:p.x+Math.random()*18,y:p.y+p.h,vx:(Math.random()-.5)*40,vy:60,life:.4,col:Math.random()<.5?'#fff':'#ffb3c7',s:3})}
 else if(p.dashT>0&&!p.on)p.vy=Math.min(p.vy+GRAV*.35*dt,200);
 else p.vy=Math.min(p.vy+GRAV*dt,p.pound?1000:880);
 /* action */
 if(ap&&p.actCd<=0){
  if(c.id==='kaden'){p.dashT=.34;p.actCd=.85;sfx.dash()}
  else if(c.id==='olivia'){p.actT=p.actDur=.3;p.actCd=.42;sfx.swing()}

   const tx=Math.floor((p.x+9+p.face*24)/T);for(let ty=Math.floor(p.y/T);ty<=Math.floor((p.y+p.h-1)/T);ty++)if(tx>=0&&tx<L.w&&L.g[ty]&&L.g[ty][tx]==='B')breakTile(tx,ty)}

  for(const e of ents)if(e.active&&!e.dying&&Math.abs(e.x+e.w/2-p.x-9)<96&&Math.abs(e.y+e.h-p.y-p.h)<56)killEnt(e);
  const ty=Math.floor((p.y+p.h+2)/T);for(let tx=Math.floor(p.x/T);tx<=Math.floor((p.x+p.w-.01)/T);tx++)if(L.g[ty]&&L.g[ty][tx]==='B')breakTile(tx,ty)}

 const blink=(G.t%3.2)<.12,ey=se?cy-.8:cy-.6;
 for(const ex of[-1.6,5]){if(blink){ctx.fillStyle='#2a1c14';ctx.fillRect(ex-1.8,ey+.2,3.6,1)}else if(se){

function resize(){
 const sw=innerWidth,sh=innerHeight,cs=getComputedStyle($('sa')),st=parseFloat(cs.paddingTop)||0,sb=parseFloat(cs.paddingBottom)||0;
 const portrait=sh>sw*1.1;document.body.classList.toggle('portrait',portrait);
 let cw,ch;
 if(portrait){
  const sc=Math.min(sw/(11*T),1.6);VW=Math.round(sw/sc);VIEWH=Math.max(11*T,Math.min(VH,Math.floor((sh-st-sb-175)/sc)));cw=sw;ch=VIEWH*sc;ASP=VW/VIEWH;
 }else{
  const asp=Math.max(4/3,Math.min(2.3,sw/sh));ASP=asp;cw=sw;ch=sw/asp;if(ch>sh){ch=sh;cw=sh*asp}
  VIEWH=ch<520?11*T:VH;VW=Math.round(VIEWH*asp);
 }
 cv.style.marginTop=(portrait?st:0)+'px';
 const dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);cv.style.width=cw+'px';cv.style.height=ch+'px';SC=cv.height/VIEWH;
}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
